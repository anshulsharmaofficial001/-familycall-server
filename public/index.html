<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#1A237E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <title>FamilyCall</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1A237E; color: white; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 20px;
    }
    h1 { font-size: 32px; margin-bottom: 4px; margin-top: 20px; }
    .subtitle { opacity: 0.7; margin-bottom: 24px; font-size: 14px; }
    .card {
      background: rgba(255,255,255,0.1); border-radius: 16px;
      padding: 24px; width: 100%; max-width: 360px; margin-bottom: 12px;
    }
    .status-icon { font-size: 48px; margin-bottom: 12px; }
    .status-text { font-size: 18px; margin-bottom: 4px; }
    .status-detail { font-size: 14px; opacity: 0.7; }
    .call-input { display: flex; gap: 8px; margin-top: 12px; }
    .call-input input {
      flex: 1; border-radius: 8px; border: none; padding: 12px; font-size: 16px;
      background: rgba(255,255,255,0.2); color: white; outline: none;
    }
    .call-input input::placeholder { color: rgba(255,255,255,0.6); }
    .btn-call {
      background: #43A047; color: white; border: none; border-radius: 8px;
      padding: 12px 20px; font-size: 16px; cursor: pointer; white-space: nowrap;
    }
    .btn-call:active { opacity: 0.8; }
    .incoming-call {
      display: none; background: #1B5E20; border-radius: 16px;
      padding: 40px 32px; width: 100%; max-width: 360px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
      70% { box-shadow: 0 0 0 20px rgba(76,175,80,0); }
      100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
    }
    .caller-name { font-size: 28px; font-weight: bold; margin: 16px 0; }
    .caller-label { font-size: 14px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
    .btn-group { display: flex; gap: 16px; margin-top: 32px; justify-content: center; }
    .btn {
      width: 72px; height: 72px; border-radius: 50%; border: none;
      cursor: pointer; font-size: 28px; display: flex; align-items: center;
      justify-content: center; transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.9); }
    .btn-accept { background: #43A047; color: white; }
    .btn-decline { background: #E53935; color: white; }
    .btn-end { background: #E53935; color: white; }
    .in-call { display: none; width: 100%; max-width: 360px; }
    .in-call .caller-name { font-size: 24px; }
    .in-call .timer { font-size: 36px; margin: 24px 0; font-variant-numeric: tabular-nums; }
    .call-status { font-size: 14px; opacity: 0.7; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>📞 FamilyCall</h1>
  <p class="subtitle">Call family with just their username</p>

  <div class="card" id="statusBox">
    <div class="status-icon" id="statusIcon">📡</div>
    <div class="status-text" id="statusText">Connecting...</div>
    <div class="status-detail" id="statusDetail">Please wait</div>
    <div class="call-input" id="callInputBox">
      <input type="text" id="calleeInput" placeholder="Enter username to call" maxlength="30">
      <button class="btn-call" id="callBtn">📞 Call</button>
    </div>
  </div>

  <div class="incoming-call" id="incomingCall">
    <div class="caller-label">Incoming Call</div>
    <div class="caller-name" id="callerName">Family Member</div>
    <div class="btn-group">
      <button class="btn btn-accept" id="acceptBtn">📞</button>
      <button class="btn btn-decline" id="declineBtn">✕</button>
    </div>
  </div>

  <div class="in-call" id="inCall">
    <div class="caller-name" id="inCallName">Call</div>
    <div class="timer" id="callTimer">00:00</div>
    <div class="call-status" id="callStatusText">Connected</div>
    <div class="btn-group">
      <button class="btn btn-end" id="endCallBtn">✕</button>
      <button class="btn" style="background:#555" id="muteBtn">🔇</button>
    </div>
  </div>

  <script>
    window.FAMILYCALL_SERVER_URL = '';
  </script>
  <script src="/js/app.js"></script>
</body>
</html>
